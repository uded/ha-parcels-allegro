name: Release

# Tag-driven: push a tag like 0.0.1 (no "v", suite convention) on main. This
# repo is outside ha-parcel-integrations, so the org's release-bot flow is not
# available; this builds the same HACS archive and publishes the release.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔎 Tag matches manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/allegro_orders/manifest.json'))['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      # HACS unpacks the archive straight into custom_components/<domain>, so
      # the archive holds the component's files without a directory above them.
      - name: 📦 Build the HACS archive
        run: git archive --format=zip --output=allegro_orders.zip HEAD:custom_components/allegro_orders

      - name: 🚀 Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" allegro_orders.zip --title "$GITHUB_REF_NAME" --generate-notes
